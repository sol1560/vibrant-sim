name: capability-probe
on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [linux, macos, windows, all]
        default: all

jobs:
  linux:
    if: inputs.os == 'linux' || inputs.os == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: specs
        run: |
          echo "## linux" >> $GITHUB_STEP_SUMMARY
          nproc; free -g; df -h /; uname -a
          ls -l /dev/kvm || echo "NO KVM"
      - name: early artifact (visibility test)
        run: mkdir -p out && date -Is > out/early.txt
      - uses: actions/upload-artifact@v4
        with: { name: linux-early, path: out/early.txt }
      - name: webtop
        run: |
          set -x
          timeout 300 docker run -d --name webtop --shm-size=1gb -p 3000:3000 \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            lscr.io/linuxserver/webtop:ubuntu-xfce || echo "WEBTOP_PULL_FAIL"
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            echo "try $i -> $code"
            [ "$code" = "200" ] && echo "WEBTOP_OK after ${i}s" && break
            sleep 2
          done
          docker logs webtop 2>&1 | tail -30
      - name: desktop control probe (xdotool/scrot inside container)
        run: |
          docker exec webtop bash -lc 'apt-get update -qq && apt-get install -y -qq xdotool scrot imagemagick' || echo "APT_FAIL"
          docker exec webtop bash -lc 'DISPLAY=:1 xdotool getdisplaygeometry' || echo "XDOTOOL_FAIL"
          docker exec webtop bash -lc 'DISPLAY=:1 import -window root /tmp/s.png && identify /tmp/s.png' || echo "SCREENSHOT_FAIL"
          docker cp webtop:/tmp/s.png out/linux-desktop.png || true
      - name: cloudflared quick tunnel
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3000 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$url" ] && break; sleep 2
          done
          echo "TUNNEL_URL_FOUND=${url:-NONE}"
          if [ -n "$url" ]; then
            sleep 5
            echo "tunnel http code: $(curl -s -o /dev/null -w '%{http_code}' -L "$url/")"
          fi
          tail -20 cf.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-probe, path: out/ }

  macos:
    if: inputs.os == 'macos' || inputs.os == 'all'
    runs-on: macos-latest
    steps:
      - name: specs
        run: |
          sw_vers; uname -m; sysctl -n hw.ncpu hw.memsize; df -h /
          echo "user=$(whoami) console=$(stat -f%Su /dev/console)"
          launchctl managername || true
      - name: screencapture (GUI session test)
        run: |
          mkdir -p out
          screencapture -x out/mac-screen.png && echo "SCREENCAPTURE_OK" || echo "SCREENCAPTURE_FAIL"
          if [ -f out/mac-screen.png ]; then
            sips -g pixelWidth -g pixelHeight out/mac-screen.png
            python3 -c "
import subprocess,sys
o=subprocess.run(['sips','-g','pixelWidth','out/mac-screen.png'],capture_output=True,text=True).stdout
print('size info:',o.strip())
"
          fi
      - name: applescript / UI automation (TCC test)
        run: |
          osascript -e 'tell application \"System Events\" to get name of every process' 2>&1 | head -5 || echo "OSASCRIPT_FAIL"
          osascript -e 'tell application \"Finder\" to activate' 2>&1 || echo "ACTIVATE_FAIL"
          osascript -e 'tell application \"System Events\" to keystroke \"a\"' 2>&1 || echo "KEYSTROKE_FAIL"
      - name: enable built-in VNC (ARD)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw openrun1 -restart -agent -privs -all 2>&1 | tail -5 || echo "KICKSTART_FAIL"
          sleep 5
          (nc -z -v 127.0.0.1 5900 && echo "VNC_5900_OPEN") || echo "VNC_5900_CLOSED"
          lsof -iTCP -sTCP:LISTEN -n -P 2>/dev/null | head -20 || true
      - name: novnc + websockify
        run: |
          python3 -m pip install --quiet websockify 2>&1 | tail -2 || brew install websockify 2>&1 | tail -3
          git clone --depth 1 -q https://github.com/novnc/noVNC.git /tmp/novnc || echo "NOVNC_CLONE_FAIL"
          (python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > /tmp/ws.log 2>&1 &) || echo "WEBSOCKIFY_FAIL"
          sleep 6
          echo "novnc http: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:6080/vnc.html)"
          tail -10 /tmp/ws.log || true
      - name: cloudflared on macos
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar xzf cloudflared && chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$url" ] && break; sleep 2
          done
          echo "TUNNEL_URL_FOUND=${url:-NONE}"
          [ -n "$url" ] && { sleep 5; echo "tunnel code: $(curl -s -o /dev/null -w '%{http_code}' -L "$url/vnc.html")"; }
          tail -15 cf.log
      - name: xcode / simulators
        run: |
          xcodebuild -version || true
          xcrun simctl list runtimes 2>&1 | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: macos-probe, path: out/ }

  windows:
    if: inputs.os == 'windows' || inputs.os == 'all'
    runs-on: windows-latest
    steps:
      - name: specs
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select Caption,Version,TotalVisibleMemorySize
          (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          Get-PSDrive C | Select Used,Free
          "session: $([System.Environment]::UserInteractive)"
      - name: screenshot test
        shell: pwsh
        run: |
          mkdir out -Force | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            "bounds: $($b.Width)x$($b.Height)"
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out/win-screen.png")
            "SCREENSHOT_OK"
          } catch { "SCREENSHOT_FAIL: $_" }
      - name: sendkeys / ui automation test
        shell: pwsh
        run: |
          try {
            Add-Type -AssemblyName System.Windows.Forms
            [System.Windows.Forms.SendKeys]::SendWait("a")
            "SENDKEYS_OK"
          } catch { "SENDKEYS_FAIL: $_" }
          try {
            Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            "UIA root: $($root.Current.Name)"
            $kids = $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
            "UIA children: $($kids.Count)"
          } catch { "UIA_FAIL: $_" }
      - name: rdp / vnc feasibility
        shell: pwsh
        run: |
          (Get-Service TermService).Status
          try { (Get-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server').fDenyTSConnections } catch { "reg read fail" }
          choco install tightvnc -y --no-progress --installargs "ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=0" 2>&1 | Select-Object -Last 10
          Start-Sleep 5
          Get-NetTCPConnection -State Listen -LocalPort 5900 -ErrorAction SilentlyContinue | Select LocalPort,OwningProcess
          if ($?) { "VNC_5900_OPEN" } else { "VNC_5900_CLOSED" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-probe, path: out/ }
